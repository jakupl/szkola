<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td[rowspan]{
            background: cornflowerblue;
        }
        td[colspan]{
            background: orange;
        }
        caption{
            color: pink;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <tr>table row</tr>
        <td>table data</td>
        <th>table head</th>
        <caption>wysrodkowana etykieta opisowa nad tabela</caption>
        <thead></thead>
        <tbody></tbody>
        <tr rowspan="2"></tr>
        <td colspan="2"></td>
    </table>
    
    Tabele niesymentryczne
    <table><caption>Nazwa</caption>Cala tabela</table>
    <figure><figcaption>Nazwa tabeli</figcaption><table>Cala tabela</table></figure>

    Tabele zagniezdzone
    <table border="3">
        <tr>
            <td>
                <table border="1">
                    <tr>
                        <td>1</td>
                        <td>2</td>
                    </tr>
                    <tr>
                        <td colspan="2">3</td>
                    </tr>
                
                </table>
            </tr>
            <td>
            <table border="1">
                <tr>
                    <td rowspan="2">1</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>3</td>
                </tr>
            </td>
            </td>
        </tr>

    </table>

</body>
</html>
